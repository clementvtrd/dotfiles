schemaVersion: "2"
kind: sandbox
name: clementvtrd-claude
version: "1.0.0"
displayName: Clément's Claude Code setup
description: Global CLAUDE.md, settings, and plugins

sandbox:
  image: docker/sandbox-templates:claude-code-docker
  entrypoint: [claude]

permissions:
  network:
    allow:
      - "github.com"
      - "api.github.com"
      - "codeload.github.com"
      - "objects.githubusercontent.com"
      - "raw.githubusercontent.com"
      - "registry.npmjs.org"
      - "ghcr.io"
      - "pkg-containers.githubusercontent.com"
      - "astral.sh"
      - "pypi.org"
      - "files.pythonhosted.org"
      - "pecl.php.net"

credentials:
  - service: github
    apiKey:
      name: GITHUB_TOKEN
      proxyManaged: true
      inject:
        - domain: api.github.com
          header: Authorization
          format: "Bearer %s"
        - domain: github.com
          header: Authorization
          format: "Bearer %s"

setup:
  install:
    - user: "0"
      description: Update and install dependencies
      command: |
        apt update
        apt upgrade -y
        apt install libnss3-tools

        git clone https://github.com/FiloSottile/mkcert /opt/mkcert

  startup:
    - user: "0"
      description: Update mkcert
      command:
        - sh
        - -c
        - |
          cd /opt/mkcert
          go build -ldflags "-X main.Version=$(git describe --tags)"
          chmod +x mkcert
          mv /opt/mkcert/mkcert /usr/local/bin/mkcert

    - user: "1000"
      description: Merge dotfiles settings.json over the sandbox defaults
      command:
        - sh
        - -c
        - |
          set -eu
          base=/home/agent/.claude/settings.json
          mine=/home/agent/.config/sbx-claude/settings.json
          [ -f "$mine" ] || exit 0
          [ -f "$base" ] || echo '{}' > "$base"
          tmp=$(mktemp)
          jq -s '.[0] * .[1]' "$base" "$mine" > "$tmp"
          mv "$tmp" "$base"

    - user: "1000"
      description: Install/upgrade spec-kit specify CLI (latest, with bundled extensions)
      command:
        - sh
        - -c
        - |
          set -u
          export PATH="/home/agent/.local/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            curl -fsSL https://astral.sh/uv/install.sh | sh >/dev/null 2>&1 || true
            export PATH="/home/agent/.local/bin:$PATH"
          fi
          command -v uv >/dev/null 2>&1 || exit 0
          uv tool install specify-cli --force >/dev/null 2>&1 || true
          specify --version 2>/dev/null || true

    - user: "1000"
      description: Install personal skills from the public dotfiles repo (Claude Code only)
      command:
        - sh
        - -c
        - |
          set -u
          export DO_NOT_TRACK=1
          command -v npx >/dev/null 2>&1 || exit 0
          npx -y skills@1.7.0 add clementvtrd/dotfiles -g -a claude-code -s '*' -y || true
