schemaVersion: "2"
kind: mixin
name: clementvtrd-claude
version: "1.0.0"
displayName: Clément's Claude Code setup
description: Global CLAUDE.md, settings, rtk, and plugins from the dotfiles repo.

requires:
  agent: claude

permissions:
  network:
    allow:
      - "github.com"                            # plugin marketplaces + rtk release
      - "codeload.github.com"
      - "objects.githubusercontent.com"
      - "raw.githubusercontent.com"
      - "registry.npmjs.org"
      - "ghcr.io"                               # github MCP server image
      - "pkg-containers.githubusercontent.com"
      - "astral.sh"                              # uv installer
      - "pypi.org"                               # specify-cli (spec-kit)
      - "files.pythonhosted.org"
      - "pecl.php.net"

setup:
  install:
    - user: "0"
      description: Install rtk (the PreToolUse hook runs on every Bash call)
      command: |
        set -eu
        command -v rtk >/dev/null 2>&1 && exit 0
        tmp=$(mktemp -d)
        curl -fsSL -o "$tmp/rtk.tgz" \
          https://github.com/rtk-ai/rtk/releases/download/v0.46.0/rtk-aarch64-unknown-linux-gnu.tar.gz
        tar -xzf "$tmp/rtk.tgz" -C "$tmp"
        install -m 0755 "$(find "$tmp" -type f -name rtk | head -1)" /usr/local/bin/rtk
        rm -rf "$tmp"

  startup:
    - user: "1000"
      description: Merge dotfiles settings.json over the sandbox defaults
      command:
        - sh
        - -c
        - |
          set -eu
          base=/home/agent/.claude/settings.json
          mine=/home/agent/.config/sbx-claude/settings.json
          [ -f "$mine" ] || exit 0
          [ -f "$base" ] || echo '{}' > "$base"
          tmp=$(mktemp)
          jq -s '.[0] * .[1]' "$base" "$mine" > "$tmp"
          mv "$tmp" "$base"

    - user: "1000"
      description: Install/upgrade spec-kit specify CLI (latest, with bundled extensions)
      command:
        - sh
        - -c
        - |
          set -u
          export PATH="/home/agent/.local/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            curl -fsSL https://astral.sh/uv/install.sh | sh >/dev/null 2>&1 || true
            export PATH="/home/agent/.local/bin:$PATH"
          fi
          command -v uv >/dev/null 2>&1 || exit 0
          uv tool install specify-cli --force >/dev/null 2>&1 || true
          specify --version 2>/dev/null || true
