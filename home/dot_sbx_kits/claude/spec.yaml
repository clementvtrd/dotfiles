schemaVersion: "2"
kind: mixin
name: my-claude

network:
  serviceDomains:
    api.github.com: github
    github.com: github
  serviceAuth:
    github:
      headerName: Authorization
      valueFormat: "Bearer %s"
  allowedDomains:
    - "github.com:443"

credentials:
  sources:
    github:
      env:
        - GH_TOKEN

commands:
  install:
    - description: Install rtk
      user: "1000"
      command: |
        curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
        echo 'export PATH="$HOME/.local/bin:$PATH"' >> /etc/sandbox-persistent.sh
        export PATH="$HOME/.local/bin:$PATH"
        rtk telemetry disable

    - description: Install Specify
      user: "1000"
      command: uv tool install specify-cli --from git+https://github.com/github/spec-kit.git

  startup:
    - description: Write user-scope claude settings
      user: "1000"
      command:
        - sh
        - -c
        - |
          mkdir -p /home/agent/.claude
          cat > /home/agent/.claude/settings.json <<'JSON'
          {
            "$schema": "https://json.schemastore.org/claude-code-settings.json",
            "theme": "auto",
            "model": "opus[1m]",
            "hooks": {
              "PreToolUse": [
                {
                  "matcher": "Bash",
                  "hooks": [
                    {
                      "type": "command",
                      "command": "rtk hook claude"
                    }
                  ]
                }
              ]
            },
            "extraKnownMarketplaces": {
              "mattpocock": {
                "source": {
                  "source": "github",
                  "repo": "mattpocock/skills"
                }
              }
            },
            "enabledPlugins": {
              "mattpocock-skills@mattpocock": true
            }
          }
          JSON
